# Eight free-running sine LFOs, one per output: the patch a new master starts with.
# O1: [SIN 0.1] sine, 0.1 Hz
# O2: [SIN 0.2] sine, 0.2 Hz
# O3: [SIN 0.3] sine, 0.33 Hz
# O4: [SIN 0.5] sine, 0.5 Hz
# O5: [SIN 1] sine, 1 Hz
# O6: [SIN 2] sine, 2 Hz
# O7: [SIN 4] sine, 4 Hz
# O8: [SIN 8] sine, 8 Hz
#
# Every output swings -5 V .. +5 V. Load your own droid.ini from the module's
# context menu ("Load DROID patch…") to replace this one.

[lfo]
    hz = 0.1
    bipolar = on
    level = 5V
    sine = O1

[lfo]
    hz = 0.2
    bipolar = on
    level = 5V
    sine = O2

[lfo]
    hz = 0.33
    bipolar = on
    level = 5V
    sine = O3

[lfo]
    hz = 0.5
    bipolar = on
    level = 5V
    sine = O4

[lfo]
    hz = 1
    bipolar = on
    level = 5V
    sine = O5

[lfo]
    hz = 2
    bipolar = on
    level = 5V
    sine = O6

[lfo]
    hz = 4
    bipolar = on
    level = 5V
    sine = O7

[lfo]
    hz = 8
    bipolar = on
    level = 5V
    sine = O8
