# Eight free-running LFOs, one per output: the patch a new master starts with.
# O1: [SIN 0.1] sine, 0.1 Hz
# O2: [TRI 0.2] triangle, 0.2 Hz
# O3: [SAW 0.3] sawtooth, 0.33 Hz
# O4: [RMP 0.5] ramp, 0.5 Hz
# O5: [SIN 1] sine, 1 Hz
# O6: [TRI 2] triangle, 2 Hz
# O7: [SQR 4] square, 4 Hz
# O8: [COS 8] cosine, 8 Hz
#
# Every output swings -5 V .. +5 V. Load your own droid.ini from the module's
# context menu ("Load DROID patch…") to replace this one.

[lfo]
    hz = 0.1
    bipolar = on
    level = 5V
    sine = O1

[lfo]
    hz = 0.2
    bipolar = on
    level = 5V
    triangle = O2

[lfo]
    hz = 0.33
    bipolar = on
    level = 5V
    sawtooth = O3

[lfo]
    hz = 0.5
    bipolar = on
    level = 5V
    ramp = O4

[lfo]
    hz = 1
    bipolar = on
    level = 5V
    sine = O5

[lfo]
    hz = 2
    bipolar = on
    level = 5V
    triangle = O6

[lfo]
    hz = 4
    bipolar = on
    level = 5V
    square = O7

[lfo]
    hz = 8
    bipolar = on
    level = 5V
    cosine = O8
